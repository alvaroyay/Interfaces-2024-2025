<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresa XYZ</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <div class="logo">
            
    
            <picture>
                 <!--      WebP      -->
             <source srcset="Media/logowebp600.webp" type="image/webp" media="(min-width: 800px)" sizes="15vw">
             <source srcset="Media/logowebp.webp" type="image/webp" media="(min-width: 400px)" sizes="10vw">
             
             <!--      JPEG       -->
             <source srcset="Media/logojpeg600.jpeg" type="image/jpeg" media="(min-width: 800px)" sizes="15vw">
             <source srcset="Media/logojpeg.jpeg" type="image/jpeg" media="(min-width: 400px)" sizes="10vw">
             
             <!--    Imagen por defecto (png)    -->
             <img src="Media/logopng.png" alt="Logotipo de la empresa" >
            </picture>

            <audio autoplay  loop controls  muted> <!-- Etiqueta autoplay empieza el audio nada mas cargar la pagina (solo funciona si esta muteado, controsl hace visibles los controles del reproductor del audio
                loop hace que el audio se reproduzca en bucle , muted hace que el audio empiece silenciado para que funciona la etiqueta autoplay,la etiqueta controls solo es para probar si va el audio -->
                <!-- Formato OGG -->
                <source src="Media/siuogg.ogg" type="audio/ogg">
                <!-- Formato MP3 -->
                <source src="Media/siump3.mp3" type="audio/mp3">
                El navegador no soporta el audio 
            </audio>
            
        </div>
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#servicios">Login</a></li>
                <li><a href="#nosotros">Registrate</a></li>
                
            </ul>
        </nav>
    </header>
   
    
    <section id="inicio" class="Imageninicio">
        <img class="balonfutbol" src="Media/Pelotafutbol.png" alt="ball"width="100" height="100" />
        <img class="balonbasket" src="Media/balonbasket.webp" alt="ball"width="80" height="80" />
    </section>
    
    <section id="videos" class="Videos" > 
       <h1> Videos </h1>
        <video autoplay controls loop muted width="360" height="240">
            <source src="Media/VideoCoporativoMP4.mp4" type="video/mp4">
            <source src="Media/VideoCorporativoOGV.ogv" type="video/ogv">
            No está soportado el vídeo
        </video>
        
      
        <iframe width="420" height="345"
        src="https://www.youtube.com/embed/eFgSL_CHYwg?playlist=eFgSL_CHYwg&loop=1&controls=1&autoplay=1&mute=1">
</iframe>

    </section>

    <section>
        <div class="deportesdisponibles">
            <h2>Deportes disponibles</h2>
            <div class="deporte">Baloncesto</div>
            <div class="deporte">Futbol</div>
            <div class="deporte">Tenis</div>
        </div>
    </section>
    
    
    <footer>
        <p>&copy; 2025 SportivaGestion. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
